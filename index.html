<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>bringing your stuff over</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f2efe9; color: #2a2a2a; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; text-align: center; }
  a { color: inherit; }
</style>
</head>
<body>
<p id="msg">bringing your stuff over...</p>
<script>
// This page lives at yeonskie.github.io (the OLD address). A browser keeps a separate save for each web address, and only a page on
// that address can read the old one. So this reads it, packs it into a link, and sends you to the new address with it.
// It only ever sends to yeonskie.com, and never copies the owner sign-in.
(function () {
  var NEW_SITE = "https://yeonskie.com/";
  var SKIP = ["journal-session"];
  var data = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (SKIP.indexOf(k) > -1) continue;
      var v = localStorage.getItem(k);
      if (typeof v === "string") data[k] = v;
    }
  } catch (e) {}
  var out = "none";
  if (Object.keys(data).length) {
    var bytes = new TextEncoder().encode(JSON.stringify(data)), bin = "";
    for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    out = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  var url = NEW_SITE + "#import=" + out;
  document.getElementById("msg").innerHTML = 'taking you back... <br><a href="' + url + '">tap here if nothing happens</a>';
  location.replace(url);
})();
</script>
</body>
</html>
